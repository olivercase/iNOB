[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inob"
description = "Whole-body FEM forward modelling and sensor planning for OPM-MEG / EEG of peripheral and autonomic nerves"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
authors = [{ name = "Oliver Case", email = "oliver@fizzymilk.com" }]
license = { text = "MIT" }
keywords = ["MEG", "OPM", "EEG", "forward model", "FEM", "vagus nerve", "spinal cord", "DUNEuro"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Loose runtime pins so local dev works on whatever wheels are available.
# Strict pins for the UCL clusters live in requirements-cluster.txt
# (manylinux2014 / older glibc forces numpy<2 there).
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.10",
    "trimesh>=4.0",
    "scikit-image>=0.22",
    "matplotlib>=3.8",
    "pyvista>=0.43",
    "iso2mesh>=0.2",
    "pymeshfix>=0.16",
    "pyyaml>=6.0",
    "rtree>=1.1",
]

[project.urls]
Homepage = "https://github.com/olivercase/iNOB"
Repository = "https://github.com/olivercase/iNOB"
Issues = "https://github.com/olivercase/iNOB/issues"
Changelog = "https://github.com/olivercase/iNOB/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "h5py>=3.10",
    # GUI backend tests drive the FastAPI app through starlette's TestClient,
    # which needs httpx (and fastapi itself, from the [gui] extra).
    "fastapi>=0.110",
    "httpx>=0.27",
]
# GUI backend (gui/backend/app.py). `pip install inob[gui]` is self-contained.
gui = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
]

[project.scripts]
# The entry point: `inob <command>`. Run `inob --help` for the command list.
inob            = "inob.cli.main:main"

# Legacy one-binary-per-stage names, kept so existing scripts, the Makefile,
# and the cluster job files keep working. `inob <command>` is the same code.
inob-pipeline   = "inob.cli.pipeline:main"
inob-build-geom = "inob.cli.build_geom:main"
inob-build-fem  = "inob.cli.build_fem:main"
inob-sensors    = "inob.cli.generate_sensors:main"
inob-electrodes = "inob.cli.generate_electrodes:main"
inob-forward    = "inob.cli.run_forward:main"
inob-eeg        = "inob.cli.run_eeg:main"
inob-volume-field = "inob.cli.volume_field:main"
inob-snr        = "inob.cli.snr:main"
inob-sensitivity = "inob.cli.sensitivity:main"
inob-sarvas     = "inob.cli.sarvas:main"
inob-ladder     = "inob.cli.ladder:main"
inob-cross      = "inob.cli.cross_modality:main"
inob-detect     = "inob.cli.detectability:main"
inob-location   = "inob.cli.location:main"
inob-calibrate  = "inob.cli.calibrate:main"
inob-physiology = "inob.cli.physiology:main"
inob-cap-compare = "inob.cli.cap_compare:main"
inob-topoplot   = "inob.cli.topoplot:main"
inob-torso      = "inob.cli.torso:main"
inob-sensor-field = "inob.cli.sensor_field:main"
inob-visualise  = "inob.cli.visualise:main"
inob-muscle-sources = "inob.cli.muscle_sources:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "inob.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"
# AppleDouble metadata files appear on macOS-mounted external volumes; they
# are not source.
extend-exclude = ["**/._*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # default args in function defs (argparse-friendly)
    "RUF001", # unicode in strings (intentional in scientific docstrings)
    "RUF002", # unicode in docstrings
    "RUF003", # unicode in comments
    "B017",   # raises Exception in tests (we accept generic raises)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that take >5s",
    "duneuro: tests requiring duneuropy (auto-skipped if unavailable)",
]
