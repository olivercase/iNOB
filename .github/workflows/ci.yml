name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The token can read the repo and nothing else; the release workflow asks for
# more, explicitly, only where it needs it.
permissions:
  contents: read

# A new push to the same branch/PR supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    # Backstop for the local pre-commit hooks (whitespace, YAML/TOML/JSON,
    # large files, private keys, ruff, TODO guard). Hooks are opt-in and
    # `--no-verify` exists, so this is the only run every change must pass.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install pre-commit pyyaml
      - run: SKIP=gitleaks pre-commit run --all-files --show-diff-on-failure

  secrets:
    # Whole history, not just the diff: a secret committed and then removed
    # is still in the clone.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PyVista renders the FEM figure through VTK, which needs an OpenGL
      # context. A GitHub runner has no display, so the render segfaulted the
      # whole pytest process (exit 139) rather than failing a test. Xvfb gives
      # it one.
      - name: Install rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglx-mesa0 libxrender1 libxext6 libsm6

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff lint
        # Whole repo, not just src/tests — scripts/ and gui/ are shipped code
        # too, and lint drift there used to go unnoticed.
        run: ruff check .

      - name: Pytest
        # DUNEuro smoke tests auto-skip when duneuropy is unavailable; the
        # duneuro-validation workflow is what actually exercises them.
        # xvfb-run supplies the display VTK needs for the FEM render test.
        env:
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: "true"
        run: xvfb-run -a pytest -q --cov=inob --cov-report=xml --cov-report=term

      - name: Coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

      - name: Package builds and passes twine check
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

  gui:
    # The browser GUI is the primary interface for non-CLI users, so a type
    # error or a broken production build must fail the PR like any other.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gui/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
