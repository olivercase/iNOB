name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PyVista renders the FEM figure through VTK, which needs an OpenGL
      # context. A GitHub runner has no display, so the render segfaulted the
      # whole pytest process (exit 139) rather than failing a test. Xvfb gives
      # it one.
      - name: Install rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglx-mesa0 libxrender1 libxext6 libsm6

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff lint
        # Whole repo, not just src/tests — scripts/ and gui/ are shipped code
        # too, and lint drift there used to go unnoticed.
        run: ruff check .

      - name: Pytest
        # DUNEuro smoke tests auto-skip when duneuropy is unavailable; the
        # duneuro-validation workflow is what actually exercises them.
        # xvfb-run supplies the display VTK needs for the FEM render test.
        env:
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: "true"
        run: xvfb-run -a pytest -q

  gui:
    # The browser GUI is the primary interface for non-CLI users, so a type
    # error or a broken production build must fail the PR like any other.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
