name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff lint
        # Whole repo, not just src/tests — scripts/ and gui/ are shipped code
        # too, and lint drift there used to go unnoticed.
        run: ruff check .

      - name: Pytest
        # DUNEuro smoke tests auto-skip when duneuropy is unavailable; the
        # duneuro-validation workflow is what actually exercises them.
        run: pytest -q

  gui:
    # The browser GUI is the primary interface for non-CLI users, so a type
    # error or a broken production build must fail the PR like any other.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
